name: pages-deploy

on:
  push:
    branches: [main]
    paths:
      - "apps/console/**"
      - "packages/manifest-schema/**"
      - "dashboard/data/batches.json"
      - "public/CNAME"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
    inputs:
      ref:
        description: "预发验证的分支/commit（默认 main；灰度 SOP 见 docs/17 §五）"
        default: main
        required: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # workflow_dispatch 可指定任意分支/commit 做预发验证（ref 输入）；push 触发恒为 main
          ref: ${{ inputs.ref || 'main' }}

      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖（workspace 链接）
        run: pnpm install --frozen-lockfile

      - name: 落地页构建说明
        run: |
          echo "::notice::Pages 已转型为落地页/文档站（曝光 + 预期管理 + 文档价值）。
          交互工作台（流水线控制/任务中心/AI 助手）由部署侧单端口服务承载（本地/私网 3030）。"

      - name: 落地页静态构建（vite.landing.config.ts → dist-landing）
        run: pnpm --filter console landing:build

      - name: 注入自定义域名 CNAME（public/CNAME = h3.yyc3.top）
        run: cp public/CNAME apps/console/dist-landing/CNAME

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: apps/console/dist-landing

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
